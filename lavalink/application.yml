# Configuración de Lavalink v4 (nodo propio).
# El password real se inyecta por la variable de entorno LAVALINK_SERVER_PASSWORD
# (definida en docker-compose.yml desde el .env). El valor de abajo es solo placeholder.
#
# IMPORTANTE: el plugin youtube-source es la pieza que YouTube rompe seguido.
# Cuando el bot deje de reproducir de YouTube, lo primero a revisar es subir
# la versión del plugin acá (última en https://github.com/lavalink-devs/youtube-source/releases)
# y redeployar.

server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth: en IPs de datacenter (Oracle) YouTube exige sesión logueada ("This video
    # requires login"); el poToken solo no alcanza. Con oauth.enabled y SIN refreshToken,
    # Lavalink imprime un código de device-flow al arrancar para autorizar una cuenta
    # (usar una DESCARTABLE). Luego el refreshToken se inyecta por env y se persiste.
    oauth:
      enabled: true
    # Clientes: TV es el ÚNICO compatible con OAuth (hace el playback autenticado que
    # esquiva el "requires login" en IPs de datacenter). MUSIC/WEB/ANDROID_VR aportan
    # búsqueda, playlist y mix (metadata) que TV no tiene.
    clients:
      - MUSIC
      - WEB
      - ANDROID_VR
      - TV

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass" # sobrescrito por LAVALINK_SERVER_PASSWORD
    sources:
      # Se desactiva el source de YouTube nativo (deprecado) en favor del plugin.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    # VM de 1 core: bajamos calidad de encoding/resampling para no saturar la CPU.
    # La diferencia de audio es imperceptible en Discord; el ahorro de CPU sí importa.
    opusEncodingQuality: 5
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
