# Lavalink v4 configuration (your own node).
# The real password is injected via the LAVALINK_SERVER_PASSWORD env var (set in
# docker-compose.yml from the .env). The value below is just a placeholder.
#
# IMPORTANT: the youtube-source plugin is the piece YouTube breaks often. When the bot
# stops playing from YouTube, the first thing to check is bumping the plugin version here
# (latest at https://github.com/lavalink-devs/youtube-source/releases) and redeploying.

server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth: on datacenter IPs (Oracle) YouTube requires a logged-in session ("This video
    # requires login"); a poToken alone is not enough. With oauth.enabled and NO refreshToken,
    # Lavalink prints a device-flow code at startup to authorise an account (use a BURNER
    # one). Then the refreshToken is injected via env and persisted.
    oauth:
      enabled: true
    # Remote cipher server: delegates YouTube player script parsing to an external service.
    # Required because youtube-source's local parser breaks whenever YouTube rotates its
    # player script (e.g. ac678d18). cipher.kikkia.dev is the maintainer-run public instance
    # (10 req/s limit — fine for a personal bot). Self-host yt-cipher if you need more.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    # Clients: TV is the ONLY OAuth-compatible one (it does the authenticated playback that
    # bypasses "requires login" on datacenter IPs). MUSIC/WEB/ANDROID_VR provide search,
    # playlist and mix (metadata) that TV lacks.
    clients:
      - MUSIC
      - WEB
      - ANDROID_VR
      - TV

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass" # overridden by LAVALINK_SERVER_PASSWORD
    sources:
      # The built-in YouTube source (deprecated) is disabled in favor of the plugin.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    # 1-core VM: we lower encoding/resampling quality so we don't saturate the CPU.
    # The audio difference is imperceptible on Discord; the CPU savings do matter.
    opusEncodingQuality: 5
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
