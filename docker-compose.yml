# Full music-bot stack, meant for the Oracle VM (E2.1.Micro, 1 GB).
#
#   lavalink      → your own audio node (official v4 image + youtube-source plugin).
#                   Only reachable on the internal Docker network: does NOT expose 2333.
#   bot           → your bot; connects to lavalink:2333 as the PRIMARY node.
#                   Public Lavalink nodes stay as fallback (logic already in index.js).
#
# YouTube on datacenter IPs (Oracle) requires a logged-in session ("This video requires
# login"). Solved with OAuth (a BURNER account) — see the oauth block in
# lavalink/application.yml and PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN below.
#
# Variables (LAVALINK_PASSWORD, DISCORD_TOKEN, etc.) are read from the .env file
# that lives ONLY on the VM (never committed — it's in .gitignore).
#
# Usage on the VM:
#   docker compose pull && docker compose up -d

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: lavalink
    restart: unless-stopped
    environment:
      # Micro VM = 1 OCPU / 1 GB. Capped heap + SerialGC (less overhead than G1 on a
      # single core with a small heap) + reduced metaspace and stack. With this Lavalink
      # sits around ~450-550 MB RSS, leaving room for the OS, Docker and the bot.
      # The VM swapfile (see DEPLOY.md) covers the spikes.
      - _JAVA_OPTIONS=-Xmx384M -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k
      - SERVER_PORT=2333
      - SERVER_ADDRESS=0.0.0.0
      # Overrides the password defined in application.yml (Spring relaxed binding).
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
      # YouTube OAuth: refresh token from a BURNER account, persisted in the VM's .env
      # (NEVER in the repo). skipInitialization avoids the device-flow on every restart
      # once a token exists. Required because on a datacenter IP YouTube demands a
      # logged-in session to play.
      - PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN}
      - PLUGINS_YOUTUBE_OAUTH_SKIPINITIALIZATION=true
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    # Note: we do NOT mount a volume on /opt/Lavalink/plugins. The image runs as a
    # non-root user and a Docker volume (root:root) gives "Permission denied" when
    # downloading the plugin .jar. Without a volume, the plugin downloads at boot into
    # the container's writable layer (seconds; only re-downloaded if the Lavalink image
    # changes, which is pinned to :4-alpine).
    networks:
      - botnet
    expose:
      - "2333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Authorization: ${LAVALINK_PASSWORD}\" -O /dev/null http://localhost:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  bot:
    # Image built and pushed by GitHub Actions (linux/amd64).
    image: ${BOT_IMAGE:-ghcr.io/thiagobrucezzi/discord-music-bot:latest}
    container_name: discord-music-bot
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      lavalink:
        condition: service_healthy
    networks:
      - botnet

networks:
  botnet:
    driver: bridge
